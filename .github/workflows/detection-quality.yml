name: Detection quality gate

on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'rules/**'
      - 'tests/**'
      - 'simulations/**'
      - 'scripts/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate detection contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run quality gate
        run: python scripts/quality_gate.py
