name: Detection quality gate

on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'rules/**'
      - 'tests/**'
      - 'simulations/**'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate detection contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python scripts offline
        run: python -m compileall -q scripts
      - name: Run quality gate
        run: python scripts/quality_gate.py
      - name: Test lab automation offline
        run: python -m unittest discover -s tests -p 'test_lab_automation.py' -v
      - name: Test executor safety offline
        run: python -m unittest discover -s tests -p 'test_executor_safety.py' -v
      - name: Test transport contracts offline
        run: python -m unittest discover -s tests -p 'test_transport_contract.py' -v
      - name: Validate Phase 3 offline evidence gate
        run: python -m unittest discover -s tests -p 'test_phase3_evidence_gate.py' -v
      - name: Test historical alert correlation offline
        run: python -m unittest discover -s tests -p 'test_phase3_alert_correlation.py' -v
      - name: Verify planning mode
        run: python scripts/lab/run.py plan

  powershell-syntax:
    name: Validate Windows PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse remote scripts without executing them
        shell: powershell
        run: |
          $failures = @()
          Get-ChildItem scripts/lab/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            $failures += $parseErrors
          }
          if ($failures.Count) { $failures | Format-List; exit 1 }
