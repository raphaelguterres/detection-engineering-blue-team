<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
  <title id="title">Detection Engineering Blue Team — arquitetura do laboratório Wazuh</title>
  <desc id="description">Windows e Sysmon geram eventos, o Wazuh Agent coleta, o Manager aplica regras, o Indexer armazena alertas, e o Dashboard permite investigá-los. Cinco detecções versionadas e testadas no CI.</desc>
