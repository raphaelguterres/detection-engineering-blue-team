    <rect x="947" y="239" width="272" height="150" rx="10" fill="#1b222b" stroke="#455260" stroke-width="1"/>
    <text x="963" y="281" fill="#f8fafc" font-weight="700" font-size="25">Wazuh Indexer</text>
    <line x1="963" y1="303" x2="1203" y2="303" stroke="#394552"/>
    <text x="963" y="338" fill="#c4ccd8" font-size="20">Indexa alertas</text>
    <rect x="1242" y="239" width="272" height="150" rx="10" fill="#1b222b" stroke="#455260" stroke-width="1"/>
    <text x="1258" y="281" fill="#f8fafc" font-weight="700" font-size="22">Wazuh Dashboard</text>
    <line x1="1258" y1="303" x2="1498" y2="303" stroke="#394552"/>
    <text x="1258" y="338" fill="#c4ccd8" font-size="20">Consulta e investiga</text>
