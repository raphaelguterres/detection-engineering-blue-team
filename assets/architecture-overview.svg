    <text x="650" y="211" fill="#b5d3ee" font-size="19" font-weight="700" letter-spacing="1.5">KALI LINUX · DOCKER · WAZUH 4.14.9</text>
    <rect x="76" y="239" width="226" height="150" rx="10" fill="#1b222b" stroke="#455260" stroke-width="1"/>
    <text x="92" y="281" fill="#f8fafc" font-weight="700" font-size="25">Windows Server</text>
    <line x1="92" y1="303" x2="286" y2="303" stroke="#394552"/>
    <text x="92" y="338" fill="#c4ccd8" font-size="20">Sysmon: eventos</text>
    <rect x="331" y="239" width="226" height="150" rx="10" fill="#1b222b" stroke="#455260" stroke-width="1"/>
    <text x="347" y="281" fill="#f8fafc" font-weight="700" font-size="25">Wazuh Agent</text>
    <line x1="347" y1="303" x2="541" y2="303" stroke="#394552"/>
    <text x="347" y="338" fill="#c4ccd8" font-size="20">Coleta telemetria</text>
    <rect x="652" y="239" width="272" height="150" rx="10" fill="#1a2938" stroke="#b5d3ee" stroke-width="2"/>
    <text x="668" y="281" fill="#f8fafc" font-weight="700" font-size="25">Wazuh Manager</text>
    <line x1="668" y1="303" x2="908" y2="303" stroke="#394552"/>
