<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="570" viewBox="0 0 1600 570" role="img" aria-labelledby="title description">
  <title id="title">Detection Engineering Blue Team — arquitetura Windows e Kali Linux</title>
  <desc id="description">Windows Server com Sysmon e Wazuh Agent envia eventos para o Kali Linux. No Kali, Docker executa Wazuh Manager, Indexer e Dashboard. As cinco regras são versionadas e testadas no GitHub.</desc>
  <rect width="1600" height="570" fill="#0d1015"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="56" y="76" fill="#f7f8fa" font-size="50" font-weight="700">Detection Engineering <tspan fill="#a7c8e5">Blue Team</tspan></text>
    <text x="58" y="120" fill="#abb4c1" font-size="22">Da telemetria Windows à investigação de alertas no Wazuh</text>
    <rect x="52" y="170" width="528" height="262" rx="14" fill="#11161d" stroke="#586573" stroke-width="1.5"/>
    <rect x="623" y="170" width="925" height="262" rx="14" fill="#11161d" stroke="#6487a9" stroke-width="1.5"/>
